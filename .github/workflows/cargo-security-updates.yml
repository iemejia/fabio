name: Cargo security updates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

# Only trusted default-branch code runs; no pull_request_target or PR-head checkout.
permissions:
  contents: read

concurrency:
  group: cargo-security-updates
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      base-sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Record audited revision
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked

      - name: Test remediation logic
        run: python3 -m unittest discover -s scripts -p 'test_cargo_security_updates.py'

      - name: Prepare all compatible security fixes
        run: python3 scripts/cargo-security-updates.py --report "$RUNNER_TEMP/cargo-security-report.md"

      - name: Report findings and manual blockers
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/cargo-security-report.md" ]; then
            cat "$RUNNER_TEMP/cargo-security-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Detect lockfile changes
        id: changes
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate remediation
        if: steps.changes.outputs.changed == 'true'
        run: |
          cargo audit --deny warnings
          cargo fmt -- --check
          cargo clippy --tests --locked -- -D warnings
          cargo test --locked
          test "$(git diff --name-only)" = 'Cargo.lock'

      - name: Package validated lockfile and report
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir "$RUNNER_TEMP/security-remediation"
          cp Cargo.lock "$RUNNER_TEMP/cargo-security-report.md" "$RUNNER_TEMP/security-remediation/"

      - name: Upload validated remediation
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-security-remediation
          path: ${{ runner.temp }}/security-remediation/
          if-no-files-found: error
          retention-days: 3

  # This fresh runner never executes the updated dependencies or their build scripts.
  publish:
    needs: remediate
    if: needs.remediate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Refuse a stale remediation
        env:
          AUDITED_SHA: ${{ needs.remediate.outputs.base-sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$AUDITED_SHA" ]; then
            echo '::error::The default branch advanced during validation. Rerun the workflow to avoid overwriting newer dependency updates.'
            exit 1
          fi

      - name: Download validated remediation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-security-remediation
          path: ${{ runner.temp }}/security-remediation/

      - name: Apply lockfile only
        run: |
          test -f "$RUNNER_TEMP/security-remediation/Cargo.lock"
          test ! -L "$RUNNER_TEMP/security-remediation/Cargo.lock"
          cp "$RUNNER_TEMP/security-remediation/Cargo.lock" Cargo.lock
          test "$(git diff --name-only)" = 'Cargo.lock'

      # A dedicated token is necessary: default GITHUB_TOKEN PRs do not trigger CI.
      # Supply Contents + Pull requests read/write on this repository only.
      - name: Require publishing token
        env:
          SECURITY_UPDATES_TOKEN: ${{ secrets.SECURITY_UPDATES_TOKEN }}
        run: |
          if [ -z "$SECURITY_UPDATES_TOKEN" ]; then
            echo '::error::Set SECURITY_UPDATES_TOKEN with Contents and Pull requests read/write so the remediation PR triggers normal CI.'
            exit 1
          fi

      - name: Create or update aggregate remediation PR
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.SECURITY_UPDATES_TOKEN }}
          branch: automation/cargo-security-updates
          base: ${{ github.event.repository.default_branch }}
          add-paths: Cargo.lock
          commit-message: 'fix(deps): remediate Cargo security findings'
          title: 'fix(deps): remediate Cargo security findings'
          body-path: ${{ runner.temp }}/security-remediation/cargo-security-report.md
          labels: dependencies
          # Deliberately no auto-merge: normal CI + review remain mandatory.
