name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/commands/context/data/agent/commands.json"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "src/commands/context/data/agent/commands.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    # Cancel superseded builds for the same ref (e.g. rapid PR pushes).
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        working-directory: docs
        run: npm ci
      - name: Test reference generator and link checker
        working-directory: docs
        run: npm test
      - name: Type-check website and validate links
        working-directory: docs
        run: npm run check
      - name: Build website
        working-directory: docs
        run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Serialize deployments and never cancel an in-flight deploy (GitHub Pages
    # recommended pattern). A newer run waits for the current deploy to finish.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
