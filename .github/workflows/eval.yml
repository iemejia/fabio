name: Skill Eval

on:
  workflow_dispatch:
  schedule:
    # Weekly on Sundays at 06:00 UTC
    - cron: '0 6 * * 0'
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - 'tests/eval/**'
      - '.github/workflows/eval.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    name: skill quality (promptfoo)
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install promptfoo
        run: npm install -g promptfoo@0.125.1

      - name: Test evaluation runner
        run: |
          python3 -m unittest discover -s tests/eval -p 'test_*.py'
          node tests/eval/check-config.mjs "$(npm root -g)"

      - name: Run eval
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_BASE_URL: ${{ secrets.AZURE_OPENAI_API_BASE_URL }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
          AZURE_OPENAI_MODEL_NAME: gpt-6.1-sol
        run: |
          python3 tests/eval/run.py --summary "$RUNNER_TEMP/eval-summary.json"

      # Raw promptfoo output embeds resolved provider configuration and can
      # disclose tenant endpoints/deployment aliases. Upload numeric counts only.
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-summary
          path: ${{ runner.temp }}/eval-summary.json
          retention-days: 30
