version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "ci"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      # @astrojs/check only supports typescript ^5 || ^6. Block major 7 (the
      # native-preview line) until @astrojs/check declares support, otherwise
      # `npm ci` fails with ERESOLVE and the docs deploy breaks.
      - dependency-name: "typescript"
        versions: [">=7"]
