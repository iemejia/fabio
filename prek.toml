# prek configuration - https://prek.j178.dev
# A faster, Rust-native drop-in replacement for pre-commit

[auto_update]
cooldown_days = 3

# General file hygiene (runs natively in Rust, no network or Python needed)
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=500"] },
]

# Secret detection (uses existing .gitleaks.toml)
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [{ id = "gitleaks" }]

# Rust tooling (local hooks using system cargo)
[[repos]]
repo = "local"

[[repos.hooks]]
id = "rustfmt"
name = "rustfmt"
entry = "cargo fmt -- --check"
language = "system"
types = ["rust"]
pass_filenames = false
priority = 0

[[repos.hooks]]
id = "clippy"
name = "clippy"
entry = "cargo clippy --tests -- -D warnings"
language = "system"
types = ["rust"]
pass_filenames = false
priority = 1

# Docs website (Node). Deterministic, dependency-free unit tests for the
# reference generator + link checker — reuses the existing `npm test` script
# (node:test, ~50ms, no node_modules/astro needed). Only runs when the docs
# site or its source of truth (commands.json) is staged. Heavier validation
# (astro check, link validation against built content, full build) needs
# node_modules and lives in the docs.yml CI workflow.
[[repos.hooks]]
id = "docs-scripts-test"
name = "docs reference generator & link-checker tests"
entry = "npm --prefix docs test"
language = "system"
files = "^(docs/|src/commands/context/data/agent/commands\\.json)"
pass_filenames = false
priority = 2
